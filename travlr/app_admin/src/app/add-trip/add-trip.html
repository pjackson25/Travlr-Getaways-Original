<h2>Add Trip</h2>

<form (ngSubmit)="addTrip()">
  <label>Code</label><br>
  <input type="text" name="code" [(ngModel)]="newTrip.code" required><br><br>

  <label>Name</label><br>
  <input type="text" name="name" [(ngModel)]="newTrip.name" required><br><br>

  <label>Length</label><br>
  <input type="text" name="length" [(ngModel)]="newTrip.length" required><br><br>

  <label>Start Date</label><br>
  <input type="date" name="start" [(ngModel)]="newTrip.start" required><br><br>

  <label>Resort</label><br>
  <input type="text" name="resort" [(ngModel)]="newTrip.resort" required><br><br>

  <label>Price Per Person</label><br>
  <input type="number" name="perPerson" [(ngModel)]="newTrip.perPerson" required><br><br>

  <label>Image</label><br>
  <input type="text" name="image" [(ngModel)]="newTrip.image"><br><br>

  <label>Description</label><br>
  <textarea name="description" [(ngModel)]="newTrip.description"></textarea><br><br>

  <button type="submit">Add Trip</button>
</form>
